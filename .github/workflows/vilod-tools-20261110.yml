    - name: Validate source and local tools
      run: |-
        node tools/check-public.mjs
        node --check extension/dashboard.mjs
        python -m py_compile tools/backup_report.py tools/csv_compare.py
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      with:
        go-version: 1.24.13
        cache: false
    - name: Validate Go and package the verified extension
      working-directory: tools/pack
      run: |-
        go vet ./...
        go run . -out "$RUNNER_TEMP/Vilod-HH-0.13.15.zip"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: Vilod-HH-0.13.15-verified
        path: ${{ runner.temp }}/Vilod-HH-0.13.15.zip
        if-no-files-found: error
        retention-days: 14
    - name: Publish the reviewed source branch
      id: publish
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' -c commit.gpgsign=false commit -m 'Vilod HH 0.13.15: import retry and local utilities'
        gh auth setup-git
        git push origin HEAD:refs/heads/tools/hh-packaging
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
